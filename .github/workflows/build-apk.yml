name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Prepare Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          echo "Restoring debug.keystore from base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        fi
        if [ ! -f debug.keystore ]; then
          echo "Generating fallback debug.keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Prepare Environment Files
      run: |
        if [ ! -f .env ] && [ -f .env.example ]; then
          cp .env.example .env
        fi
        touch .env

    - name: Build Debug APK
      run: gradle :app:assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Somet-AI-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14

    - name: Prepare APK for Direct Release
      run: |
        mkdir -p release_apks
        cp app/build/outputs/apk/debug/*.apk release_apks/somet-ai.apk || cp app/build/outputs/apk/debug/app-debug.apk release_apks/somet-ai.apk || true

    - name: Create or Update GitHub Release with Direct APK Download URL
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Somet AI v1.0.0 (Direct APK)"
        body: |
          ### Somet AI Android Application
          Download and install the APK directly to your Android device below:
          - **File**: `somet-ai.apk`
        files: |
          release_apks/somet-ai.apk
          app/build/outputs/apk/debug/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
